# SPDX-License-Identifier: MIT
#
# Dependabot cannot read platformio.ini, so this fills the gap: once a month it asks
# PlatformIO which pinned platforms/libraries have newer releases and opens (or updates)
# a single tracking issue when there is something to report. It deliberately does NOT
# open pull requests: an embedded toolchain or library bump must be a deliberate,
# hardware-tested change, never an auto-merge.
#
# TWO SOURCES, because one of them cannot see everything. `pio pkg outdated` compares
# registry packages only: a dependency pinned to a git URL has no registry version to
# compare against and is silently reported as fine. ESPAsyncWebServer is pinned exactly
# that way, so for two months this job reported "up-to-date" while 3.12.0 sat unnoticed
# upstream -- the blind spot was in the very automation meant to prevent it. The second
# step below reads the git pins straight out of platformio.ini and asks GitHub.

name: Dependency check

on:
  schedule:
    - cron: "17 6 1 * *" # monthly, first day, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    name: pio pkg outdated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check for outdated packages
        id: outdated
        run: |
          pio pkg install -e waveshare-rs485-can -e native >/dev/null
          OUT=$(pio pkg outdated 2>&1 | tee /dev/stderr)
          {
            echo "report<<EOF"
            echo "$OUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if echo "$OUT" | grep -q "Everything is up-to-date"; then
            echo "registry_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "registry_updates=true" >> "$GITHUB_OUTPUT"
          fi

      # Every `https://github.com/OWNER/REPO#vX.Y.Z` in platformio.ini, compared against that
      # repository's latest release. Derived from the file rather than listing the libraries
      # here: a second git pin added later is covered the day it is added, which is the whole
      # failure this step exists for.
      #
      # Reports nothing when a pin is already current, and says so out loud when the answer
      # could not be obtained -- "no newer version" and "cannot tell" must not look the same.
      # A month with a GitHub hiccup therefore adds a line to the tracking issue rather than
      # silently passing; noise in that direction is the safe direction.
      - name: Check git-pinned dependencies
        id: gitpins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=""
          while IFS= read -r pin; do
            slug=${pin#https://github.com/}
            repo=${slug%%#*}
            have=${slug#*#}
            latest=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [ -z "$latest" ]; then
              # Deliberately does not claim there are no releases: an empty answer here is
              # equally a 404 and a transient API failure, and `gh api` exits non-zero for
              # both. Saying which one it was would be making it up.
              REPORT="${REPORT}${repo}: pinned at ${have}; could not determine the latest release"$'\n'
            elif [ "$latest" != "$have" ]; then
              REPORT="${REPORT}${repo}: pinned at ${have}, latest is ${latest}"$'\n'
            fi
          done < <(grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[A-Za-z0-9_.-]+' platformio.ini | sort -u)
          echo "$REPORT"
          {
            echo "report<<EOF"
            echo "$REPORT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$REPORT" ]; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

      # Every `https://github.com/OWNER/REPO/releases/download/TAG/asset` in platformio.ini,
      # compared against that repository's latest release. This is how the ESP32 PLATFORM is
      # pinned, and neither step above can see it: `pio pkg outdated` compares registry packages
      # and a platform installed from a URL has no registry version, while the git-pin step
      # matches `OWNER/REPO#tag` and a download URL carries no `#`.
      #
      # Proved rather than assumed, 2026-07-31: pinning the platform back to the previous release
      # and running `pio pkg outdated` still printed "Everything is up-to-date!".
      #
      # This step exists because pinning the platform CREATED the gap it fills. The URL used to
      # end in /stable/, which auto-updated -- silently, which is why it is now pinned, but it did
      # at least keep moving. A pin with no monitoring is the opposite failure: a toolchain frozen
      # for years while nobody is told. Both are silence; this is the one that can be fixed.
      - name: Check release-URL-pinned platforms
        id: urlpins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=""
          while IFS= read -r url; do
            rest=${url#https://github.com/}
            repo=$(echo "$rest" | cut -d/ -f1,2)
            have=$(echo "$rest" | cut -d/ -f5)
            latest=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [ -z "$latest" ]; then
              REPORT="${REPORT}${repo}: pinned at ${have}; could not determine the latest release"$'\n'
            elif [ "$latest" != "$have" ]; then
              REPORT="${REPORT}${repo}: pinned at ${have}, latest is ${latest}"$'\n'
            fi
          done < <(grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[A-Za-z0-9_.-]+/' platformio.ini | sort -u)
          echo "$REPORT"
          {
            echo "report<<EOF"
            echo "$REPORT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$REPORT" ]; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update tracking issue
        if: steps.outdated.outputs.registry_updates == 'true' || steps.gitpins.outputs.updates == 'true' || steps.urlpins.outputs.updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.outdated.outputs.report }}
          GIT_REPORT: ${{ steps.gitpins.outputs.report }}
          URL_REPORT: ${{ steps.urlpins.outputs.report }}
        run: |
          TITLE="PlatformIO dependencies have updates available"
          BODY=$(printf 'Monthly `pio pkg outdated` report:\n\n```\n%s\n```\n\nGit-pinned dependencies (not visible to `pio pkg outdated`):\n\n```\n%s\n```\n\nRelease-URL-pinned platforms (visible to neither of the above — this is the ESP32 toolchain):\n\n```\n%s\n```\n\nReview the changelogs and bump deliberately — toolchain and library updates are hardware-tested changes, per docs/decisions.md. A toolchain bump is not done until a board has booted on it.' "$REPORT" "${GIT_REPORT:-none behind}" "${URL_REPORT:-none behind}")
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label dependencies
          fi
