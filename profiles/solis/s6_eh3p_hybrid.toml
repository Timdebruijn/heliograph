# SPDX-License-Identifier: MIT
#
# Solis (Ginlong) S6-EH3P three-phase hybrid — Modbus RTU register profile.
#
# WHY THIS IS NOT THE RHI PROFILE. solis/rhi_hybrid.toml is scoped to the RHI-(3-6)K-48ES-5G:
# single phase, two MPPTs. This family is three phase with four MPPTs and a high-voltage
# battery. The register SPACE turns out to be shared -- both live in the 33xxx input range --
# but "same space" is not "same device", and the two profiles disagree about which registers
# exist. Everything below was re-derived rather than inherited.
#
# SOURCES (read as source code, not as documentation):
#   A. wills106/homeassistant-solax-modbus @ 5845a931b (2026-10-14),
#      custom_components/solax_modbus/plugin_solis.py
#      Declares register, register_type, register_data_type and scale per entity, and tags
#      each with allowedtypes X1 (single phase) or X3 (three phase). That tagging is what
#      makes the phase split below evidence rather than assumption.
#   B. Pho3niX90/solis_modbus @ 011e31196 (2026-10-17),
#      custom_components/solis_modbus/sensor_data/hybrid_sensors.py
#      The integration behind solis-modbus.readthedocs.io. Declares a register list and a
#      multiplier per entity, and a `data_type` on some. Its "Tested" list names
#      S6-EH3P10K-H-EU and S6-EH3P(12-20)K-H: the same series and battery class as this
#      profile, one size up. The 8K is not on that list.
#
# HOW THE TWO AGREE, stated precisely rather than as a slogan. Every address, width and scale
# below appears in both. On SIGNEDNESS the two are not symmetrical: A declares
# register_data_type on most rows, B declares `data_type` on only a few. Where both declare,
# they agree (33029 u32, 33093 s16, 33134 s16). Where B is silent, A's declaration stands
# alone and B falls back to its own default -- which is agreement by one source and a default,
# not by two statements.
#
# Independence checked rather than assumed: different authors, different repositories,
# different data shapes (Python dataclasses vs dicts), neither generated from the other.
#
# TWO TRAPS IN SOURCE B, both of which would have produced silent nonsense:
#
#   1. `"multiplier": 0` appears throughout. It does not mean zero. The decode path treats 0
#      and 1 alike (`if multiplier == 0 or multiplier == 1`), and the bounds helpers spell the
#      same thing as `self.multiplier or 1` -- 0 is falsy in Python. Copying a 0 into a scale
#      would have made every affected channel read zero.
#   2. It carries model-specific overrides (solis_base_sensor.py, the inv_model branch).
#      S6-EH3P10K-H-ZP and Zonneplan-badged units apply 0.01 instead of the default to
#      registers {33142, 33161-33168}. Note which registers those are: 33142 is the BMS
#      battery current, NOT the 33134 mapped below, and 33161/33165 are the battery energy
#      counters that ARE mapped below. This profile is the plain -H, where the defaults apply;
#      a -ZP or Zonneplan owner must halve-check those two rows before trusting them.
#
# A TRAP IN SOLIS'S OWN DOCUMENTATION, reported repeatedly by people reading the PDF rather
# than an integration: Solis numbers registers inconsistently (33072 vs 3072) and the written
# number is sometimes one above the address to send -- "active power documented as 3005-6, the
# address to send is 3004". The numbers below are the ones both integrations put on the wire,
# which is the form that matters. Do not "correct" them against a Solis PDF without checking
# which convention that PDF uses.

[profile]
driver = "modbus_profile"
id = "solis_s6_eh3p_hybrid"
display_name = "Solis S6-EH3P hybrid (5–10 kW, three phase)"
manufacturer = "Solis"

# Two independent integrations agree on every row below. No S6 has answered THIS file.
status = "experimental"
default = false        # sph.toml holds the driver default
phases = 3
mppts = 4
battery = true
transports = ["rtu"]

# Default address is 1, changeable from the inverter's own display (manual ch. 7.3.2) and not
# from the installer app -- which matters, because owners do not always have the app.
# Line settings are the family default; neither source states them for the hybrid, and the
# 9600 8N1 figure circulating in forums is from the S6-GR1P STRING inverters, which are a
# different map entirely. Treat the rate as the first thing to vary if nothing answers.
[serial]
baud = 9600
parity = "none"
stop_bits = 1

# --- Read blocks ----------------------------------------------------------------------------
# Function 04 (input registers) throughout: both sources declare REG_INPUT for every row here.
# The 43xxx/44xxx holding range is where setpoints live and is deliberately not read.

[[block]]
space = "input"
start = 33029       # lifetime and today's generation
count = 7

[[block]]
space = "input"
start = 33049       # four MPPT strings, then total DC
count = 10

[[block]]
space = "input"
start = 33073       # three phases, then AC active power
count = 8

[[block]]
space = "input"
start = 33093       # inverter temperature, grid frequency
count = 2

# Reads through 33139 to reach SOC. 33134-33138 are not mapped, but they are not waste: the
# driver TRACE-dumps every raw block, and 33134 (battery current) and 33135 (charge/discharge
# direction) are exactly the pair a bench session needs to settle the sign question below.
[[block]]
space = "input"
start = 33133
count = 7

[[block]]
space = "input"
start = 33161       # battery charge and discharge energy, two 32-bit counters
count = 6

[[block]]
space = "input"
start = 33147       # household load
count = 1

# --- AC side --------------------------------------------------------------------------------

# 33079/33080. Signed 32-bit: source A declares REGISTER_S32 explicitly, source B lists two
# registers. Raw is watts in both.
[[register]]
measurement = "ac.power.total"
display_name = "AC output power"
space = "input"
address = 33079
type = "s32"
scale = 1
unit = "W"

[[register]]                    # 33094, both sources, 0.01 Hz
measurement = "ac.frequency"
display_name = "Grid frequency"
space = "input"
address = 33094
type = "u16"
scale = 0.01
unit = "Hz"

# 33073-33078. THE PHASE SPLIT IS SOURCED, not inferred. In source A, 33073 appears TWICE:
# once as "Inverter Voltage" tagged X1, and once as "Inverter Voltage L1" tagged X3. 33076 has
# the same pair. 33074/33075/33077/33078 are X3-only L2 and L3 entities. So the same register
# serves both topologies and is explicitly L1 on a three-phase unit -- which is what makes
# mapping it to ac.phase_l1 correct here rather than merely convenient. Source B labels
# 33073-33075 and 33076-33078 as A/B/C phase independently.
[[register]]
measurement = "ac.phase_l1.voltage"
display_name = "L1 voltage"
space = "input"
address = 33073
type = "u16"
scale = 0.1
unit = "V"

[[register]]
measurement = "ac.phase_l2.voltage"
display_name = "L2 voltage"
space = "input"
address = 33074
type = "u16"
scale = 0.1
unit = "V"

[[register]]
measurement = "ac.phase_l3.voltage"
display_name = "L3 voltage"
space = "input"
address = 33075
type = "u16"
scale = 0.1
unit = "V"

[[register]]
measurement = "ac.phase_l1.current"
display_name = "L1 current"
space = "input"
address = 33076
type = "u16"
scale = 0.1
unit = "A"

[[register]]
measurement = "ac.phase_l2.current"
display_name = "L2 current"
space = "input"
address = 33077
type = "u16"
scale = 0.1
unit = "A"

[[register]]
measurement = "ac.phase_l3.current"
display_name = "L3 current"
space = "input"
address = 33078
type = "u16"
scale = 0.1
unit = "A"

# --- PV strings -----------------------------------------------------------------------------
# All four MPPTs are in the shared map, which is the reason this profile exists separately:
# the 8 kW three-phase unit has four strings and the RHI profile maps two.
#
# NO PER-STRING POWER REGISTER EXISTS. Source B's "PV Power n" entities list the same two
# registers as the voltage and current entities -- it multiplies V by I. Rather than map a
# product as if the inverter reported one, the strings carry voltage and current only, and
# dc.power.total below is the device's own figure.

[[register]]
measurement = "dc.mppt_1.voltage"
display_name = "PV1 voltage"
space = "input"
address = 33049
type = "u16"
scale = 0.1
unit = "V"

[[register]]
measurement = "dc.mppt_1.current"
display_name = "PV1 current"
space = "input"
address = 33050
type = "u16"
scale = 0.1
unit = "A"

[[register]]
measurement = "dc.mppt_2.voltage"
display_name = "PV2 voltage"
space = "input"
address = 33051
type = "u16"
scale = 0.1
unit = "V"

[[register]]
measurement = "dc.mppt_2.current"
display_name = "PV2 current"
space = "input"
address = 33052
type = "u16"
scale = 0.1
unit = "A"

[[register]]
measurement = "dc.mppt_3.voltage"
display_name = "PV3 voltage"
space = "input"
address = 33053
type = "u16"
scale = 0.1
unit = "V"

[[register]]
measurement = "dc.mppt_3.current"
display_name = "PV3 current"
space = "input"
address = 33054
type = "u16"
scale = 0.1
unit = "A"

[[register]]
measurement = "dc.mppt_4.voltage"
display_name = "PV4 voltage"
space = "input"
address = 33055
type = "u16"
scale = 0.1
unit = "V"

[[register]]
measurement = "dc.mppt_4.current"
display_name = "PV4 current"
space = "input"
address = 33056
type = "u16"
scale = 0.1
unit = "A"

[[register]]                    # 33057/33058, both sources, raw watts
measurement = "dc.power.total"
display_name = "PV power total"
space = "input"
address = 33057
type = "u32"
scale = 1
unit = "W"

# --- Battery --------------------------------------------------------------------------------

[[register]]                    # 33133, both sources
measurement = "battery.voltage"
display_name = "Battery voltage"
space = "input"
address = 33133
type = "u16"
scale = 0.1
unit = "V"

[[register]]                    # 33161/33162, both sources u32 scale 1
measurement = "battery.energy_charged"
display_name = "Battery energy charged"
space = "input"
address = 33161
type = "u32"
scale = 1
unit = "kWh"

[[register]]                    # 33165/33166, both sources u32 scale 1
measurement = "battery.energy_discharged"
display_name = "Battery energy discharged"
space = "input"
address = 33165
type = "u32"
scale = 1
unit = "kWh"

[[register]]                    # 33139, both sources
measurement = "battery.soc"
display_name = "Battery state of charge"
space = "input"
address = 33139
type = "u16"
scale = 1
unit = "%"

# --- Temperature, energy, load ----------------------------------------------------------------

# 33093. SOURCE B DECLARES data_type S16 here; source A declares nothing and falls back to
# unsigned. So this is not a departure from the sources, it is following the one that states a
# type -- and it matches every sibling profile in this tree (growatt, goodwe, huawei, sofar,
# sungrow and solis_rhi all map inverter.temperature as s16).
#
# An earlier version of this comment claimed neither source declared a type and justified s16
# on first principles instead. That was wrong, and wrong in the way this project keeps
# catching: a field named `data_type` in B was missed because the extraction looked only for
# A's spelling, `register_data_type`. The conclusion survived; the stated evidence for it did
# not exist.
[[register]]
measurement = "inverter.temperature"
display_name = "Inverter temperature"
space = "input"
address = 33093
type = "s16"
scale = 0.1
unit = "°C"

[[register]]                    # 33035, single register, both sources
measurement = "energy.today"
display_name = "Energy today"
space = "input"
address = 33035
type = "u16"
scale = 0.1
unit = "kWh"

[[register]]                    # 33029/33030, both sources
measurement = "energy.total"
display_name = "Energy total"
space = "input"
address = 33029
type = "u32"
scale = 1
unit = "kWh"

[[register]]                    # 33147, both sources, raw watts
measurement = "load.power"
display_name = "House load"
space = "input"
address = 33147
type = "u16"
scale = 1
unit = "W"

# --- WHAT IS DELIBERATELY NOT MAPPED, and why ------------------------------------------------
#
# battery.power (33149/33150). NOT a source disagreement -- an earlier version of this comment
# said it was, and that was wrong. BOTH sources consult the direction register at 33135 to
# decide the sign: A returns the value on charge and its absolute value on discharge, B negates
# when the direction flag says charging. Neither treats the 32-bit pair as self-sufficient.
#
# The real reason it is absent is structural: this schema maps ONE register to one measurement
# and cannot combine a magnitude with a direction register. Mapping the pair alone would make a
# discharging battery read as positive power, which battery.power defines as charging.
#
# battery.current (33134) is left out for the same reason, and that matters because it is
# tempting: both sources decode it as s16, so it LOOKS self-describing. Neither states which
# direction is positive, and both ship 33135 alongside it. The sibling profile reaches the same
# conclusion in the same words -- "a confidently inverted battery graph is worse than an absent
# one" (solis/rhi_hybrid.toml). battery.soc and battery.voltage above say what they mean without
# a convention to get wrong.
#
# grid.power (33263/33264). Both sources agree on the pair, on s32 and on raw watts -- source
# A presents kW via scale 0.001 and B presents W via scale 1, which is the same raw value in
# different clothes, not a conflict.
#
# ONE SOURCE STATES THE SIGN AND THE OTHER DOES NOT. B's derived-sensor code negates this pair
# and carries the comment "Meter total active power is positive when exporting". A is silent:
# one signed value, no note. So the convention is single-sourced, and the two-source rule is
# what keeps this row out -- not, as an earlier version of this comment claimed, an absence of
# any statement at all.
#
# If B is right, canonical grid.power (positive = importing) wants scale = -1 here. That is a
# one-line change and the single most valuable row still missing, because zero-export control
# cannot be built without it. One bench reading settles it: draw a heavy load after dark and
# see which way the number moves.
#
# battery.temperature (33043). Source B only. One source is research, not a map.
#
# Battery energy counters (33161-33168). Source B applies a different scale to these on
# Zonneplan-badged and -ZP units, so the scale is model-dependent in a way this profile cannot
# express per-row. Left out rather than mapped at a scale that is right for some S6 units and
# wrong for others.
#
# Per-phase grid-port power (33512, 33515, 33518). An earlier version of this comment said
# phase C was missing from source B. It is not -- 33518 is there, with multiplier 10. Two real
# reasons remain. It is single-sourced: A carries no grid-port per-phase power at all. And the
# AC GRID PORT is not the inverter's AC output, which is what ac.phase_* means here; conflating
# them would put the wrong quantity behind a familiar name.
#
# Writable setpoints. None, deliberately -- and this is not the usual dormancy. Eniris, who
# integrate Solis hybrids commercially, state that OLDER Solis firmware implemented control by
# writing to FLASH, which has finite write endurance, and that newer firmware exposes
# curtailment registers that avoid it. A control loop on the wrong firmware wears out the
# inverter. The 44100-44112 dispatch block in source B (export limit 44104, power target
# 44106/44107, failsafe interval 44101) is the right target once a unit is in front of someone,
# the firmware level is known, and the function code this firmware sends (FC06 only) is
# confirmed to be one the inverter accepts.
